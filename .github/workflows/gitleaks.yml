name: Gitleaks credential-class scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A push to main is scanned too, after the fact. Branch protection does not bind admins, so a direct push to main
  # never meets pull_request; this makes a hit there fail visibly. main only, as leak-scan.yml's push trigger
  # (decisions_log §184(c)): canary branches are not watched, and every other branch is scanned through its PR.
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the added commits for credential-class shapes (the PR's, or the push's)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # a new branch (all-zero before) or a base this clone cannot see: scan the pushed commit itself
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="-1 ${head}"
          else
            range="${base}..${head}"
          fi
          # --redact masks matched values in output (Actions logs are public + retained)
          # --log-opts scopes the scan to the commits this PR or push added
          # gitleaks exits 0 having read nothing when git can't give it the range's patches, so the step also checks
          # gitleaks' own count: exactly one "N commits scanned" line, with N at least the commits in the range that
          # add a line (a merge, or a commit that only deletes or only touches binary files, need not be counted).
          # gitleaks hands each word of --log-opts to git log, so git gives it each commit's own text whatever the
          # runner's config or the change's .gitattributes say: --no-color, --no-textconv, and --text (a NUL byte or a
          # -diff attribute otherwise shows gitleaks "Binary files differ")
          set +e
          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts="--no-color --no-textconv --text ${range}" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path /tmp/leaks.json > /tmp/gitleaks.out 2>&1
          gl=$?
          set -e
          cat /tmp/gitleaks.out
          if [ "$gl" -ne 0 ]; then
            exit "$gl"
          fi
          if ! numstat=$(git log --no-color --no-textconv --no-ext-diff --format='commit %H' --numstat ${range}); then
            echo "::error::Could not read the commits in ${range} to check gitleaks' count against them."
            exit 1
          fi
          floor=$(printf '%s\n' "$numstat" | awk -F'\t' '/^commit / { c = $0; next } $1 ~ /^[0-9]+$/ && $1 > 0 && !(c in s) { s[c] = 1; n++ } END { print n + 0 }')
          seen=$(awk '/[0-9]+ commits scanned/ { k++; if (match($0, /[0-9]+ commits scanned/)) v = substr($0, RSTART, RLENGTH) + 0 } END { print k + 0, v + 0 }' /tmp/gitleaks.out)
          lines=${seen% *}
          scanned=${seen#* }
          if [ "$lines" -ne 1 ]; then
            echo "::error::gitleaks exited 0 but printed ${lines} \"commits scanned\" lines, not one, so nothing shows it read the added commits."
            exit 1
          fi
          if [ "$scanned" -lt "$floor" ]; then
            echo "::error::gitleaks scanned ${scanned} commit(s), but ${floor} commit(s) in ${range} add a line, so part of the change went unscanned."
            exit 1
          fi
          echo "gitleaks scanned ${scanned} commit(s); ${floor} in ${range} add a line."

      - name: Summarize on failure
        if: failure()
        run: |
          echo "::error::The credential-class scan failed on the added commits (${{ github.event_name }}): gitleaks flagged credential-shape content, or its own count did not show it read them (the scan step's ::error:: line says which)."
          echo "Run locally to see redacted details: gitleaks protect --staged --config .gitleaks.toml --redact"
          echo "Identity-marker scan is handled separately by leak-scan.yml."
