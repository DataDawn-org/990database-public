name: Gitleaks credential-class scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # A push to main is scanned too, after the fact. Branch protection does not bind admins, so a direct push to main
  # never meets pull_request; this makes a hit there fail visibly. main only, as leak-scan.yml's push trigger
  # (decisions_log §184(c)): canary branches are not watched, and every other branch is scanned through its PR.
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the added commits for credential-class shapes (the PR's, or the push's)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # a new branch (all-zero before) or a base this clone cannot see: scan the pushed commit itself
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="-1 ${head}"
          else
            range="${base}..${head}"
          fi
          # --redact masks matched values in output (Actions logs are public + retained)
          # --log-opts scopes the scan to the commits this PR or push added
          gitleaks detect \
            --config .gitleaks.toml \
            --log-opts="${range}" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path /tmp/leaks.json

      - name: Summarize on failure
        if: failure()
        run: |
          echo "::error::Gitleaks flagged credential-shape content in the added commits (${{ github.event_name }})."
          echo "Run locally to see redacted details: gitleaks protect --staged --config .gitleaks.toml --redact"
          echo "Identity-marker scan is handled separately by leak-scan.yml."
